<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scott Data Systems 1</title>
<!--
  SDS-1: a gate-level emulator of the computer from "But How Do It Know?".
  Design of the computer copyright John Clark Scott 2009, www.buthowdoitknow.com.

  The script builds the circuit and its drawing from the same description, so a
  wire on the screen is a net in the machine. The console around it borrows the
  look of the panel in src/main/resources/sds1/.

  The editor is Monaco, loaded from a pinned CDN copy. Everything else is in
  this file, and the page falls back to a plain text box when the CDN cannot be
  reached, so a lecture survives a dead connection.
-->
<style>
  :root {
    /* the console */
    --blue:        #7fa9c9;
    --blue-dk:     #5d8cae;
    --blue-dkr:    #3f6a8a;
    --frame:       #4a555d;
    --label:       #f2f7fa;

    --lamp-off:    #4a3a22;
    --lamp-on:     #ffd76a;
    --lamp-glow:   rgba(255, 190, 60, 0.75);

    --desk:        #2f3338;
    --paper:       #f4efe0;
    --ink:         #2b2620;
    --card:        #e9e4d4;
    --unit:        #d9d3c2;
    --unit-edge:   #8c8676;

    /* the drawing keeps its own palette, so the circuit stays legible */
    --line:        #8fa3bb;
    --off:         #9aa5b1;
    --on:          #e60000;
    --gp-fill: #e9f2fd;   --gp-edge: #2f6fb5;   --gp-ink: #10355f;
    --alu-fill: #fff3e3;  --alu-edge: #c8791a;  --alu-ink: #6b3d06;
    --ctrl-fill: #e8f6ed; --ctrl-edge: #2f8a4f; --ctrl-ink: #17482a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 10px;
    padding: 10px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 4px),
      var(--desk);
    color: var(--label);
    font-family: 'Cascadia Mono', Menlo, 'Courier New', monospace;
    font-size: 13px;
  }

  /* --- the console ------------------------------------------------------- */

  .panel {
    background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dk) 60%, var(--blue-dkr) 100%);
    border: 9px solid var(--frame);
    border-radius: 6px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 5px 14px rgba(0,0,0,0.45);
    position: relative;
  }
  /* the two screws that hold the panel to the frame */
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8eef2, #7d8a92 60%, #55606a);
    box-shadow: 0 1px 1px rgba(0,0,0,0.4);
  }
  .panel::before { left: 6px; top: 6px; }
  .panel::after { right: 6px; top: 6px; }

  .console { padding: 8px 26px; }

  .brand {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.28);
  }
  .brand b { font-size: 15px; letter-spacing: 0.16em; }
  .brand span { font-size: 10px; letter-spacing: 0.18em; opacity: 0.85; }
  .brand .credit { margin-left: auto; font-size: 10px; letter-spacing: 0.04em; opacity: 0.8; }
  .brand a { color: inherit; }

  .keys { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .keys .sep { width: 10px; }

  .key {
    min-width: 62px; height: 34px;
    padding: 3px 9px;
    border: none; border-radius: 6px;
    background: linear-gradient(180deg, #74959e 0%, #5d7f89 50%, #4f6e78 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.38),
      0 2px 0 #33505a,
      0 3px 5px rgba(0,0,0,0.35);
    color: #f4e5d4;
    font-family: inherit; font-size: 10px; font-weight: 700;
    letter-spacing: 0.11em; line-height: 1.15; text-align: center;
    cursor: pointer;
    text-shadow: 0 1px 0 rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.35);
    transition: transform 60ms ease, box-shadow 60ms ease;
  }
  .key:hover { background: linear-gradient(180deg, #7d9fa8 0%, #648992 50%, #55747e 100%); }
  .key:active {
    transform: translateY(2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 1px 0 #33505a, 0 1px 3px rgba(0,0,0,0.35);
  }

  .field { display: flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; }
  .field input[type=number] {
    width: 54px; font-family: inherit; font-size: 11px;
    background: #eef3f6; color: #22303b;
    border: 1px solid #22303b; border-radius: 3px; padding: 2px 4px;
  }
  .field input[type=color] {
    width: 30px; height: 24px; padding: 0; cursor: pointer;
    background: #eef3f6; border: 1px solid #22303b; border-radius: 3px;
  }

  /* the readout, an amber lamp strip like the panel's own */
  .readout {
    margin-left: auto;
    background: #1d2226; color: var(--lamp-on);
    border: 1px solid #10161a; border-radius: 3px;
    padding: 5px 11px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.7);
    text-shadow: 0 0 6px var(--lamp-glow);
  }

  /* --- the desk ---------------------------------------------------------- */

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 10px;
    min-height: 0;
  }
  main.no-program { grid-template-columns: minmax(0, 1fr); }
  main.no-program #program { display: none; }

  /* The circuit keeps a light ground. On the blue panel the wires lose their
     contrast, and this drawing has to read from the back of a lecture room. */
  #machine {
    width: 100%; height: 100%; min-height: 0;
    background: var(--paper);
    border: 2px solid var(--frame);
    border-radius: 5px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), 0 5px 14px rgba(0,0,0,0.4);
  }

  .unit {
    background: var(--unit); border: 1px solid var(--unit-edge); border-radius: 4px;
    color: var(--ink); display: flex; flex-direction: column; min-height: 0;
    box-shadow: 0 5px 14px rgba(0,0,0,0.4);
  }
  .unit-title {
    background: linear-gradient(180deg, #c3bca8, #ada695);
    border-bottom: 1px solid var(--unit-edge);
    padding: 4px 9px; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .unit-title .spacer { margin-left: auto; }
  /* The editor is out of step with memory, so the machine is running
     something else. Amber, because it is a warning and not an error. */
  #editor-mode.dirty {
    background: #8a4b1e;
    color: #ffd76a;
    padding: 1px 7px;
    border-radius: 3px;
  }
  .unit-body {
    flex: 1; min-height: 0; display: grid;
    grid-template-rows: minmax(0, 3fr) auto minmax(0, 1fr);
    gap: 7px; padding: 8px;
  }

  /* the editor, and the plain box it falls back to */
  #editor, #source {
    min-height: 0; border: 1px solid var(--unit-edge); border-radius: 3px;
    background: var(--card); overflow: hidden;
  }
  #source {
    width: 100%; resize: none; padding: 7px; color: var(--ink);
    font-family: inherit; font-size: 12px; line-height: 17px;
  }

  #listing {
    margin: 0; padding: 7px; min-height: 0; overflow: auto;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--unit-edge); border-radius: 3px;
    font-family: inherit; font-size: 11px; line-height: 15px;
    white-space: pre;
  }
  #listing .error { color: #8f2020; white-space: pre-wrap; }

  .unit-keys { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .unit-keys .key { min-width: 0; height: 28px; font-size: 9px; }
  .unit-keys .field { color: #5a5347; }
  .unit-keys .field input { border-color: var(--unit-edge); background: #f2eee2; }

  dialog {
    max-width: 640px;
    background: var(--paper); color: var(--ink);
    border: 9px solid var(--frame); border-radius: 6px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  }
  dialog pre { font-family: inherit; font-size: 12px; line-height: 17px; white-space: pre-wrap; }

  /* --- the drawing ------------------------------------------------------- */
  svg text { font-family: Arial, Helvetica, sans-serif; fill: var(--ink); }
  .wire { fill: none; stroke: var(--off); stroke-width: 1.6; stroke-linejoin: round; }
  .wire.on { stroke: var(--on); stroke-width: 2.4; }
  .dot { fill: var(--off); }
  .dot.on { fill: var(--on); }
  .gate { fill: #fbfdff; stroke: var(--off); stroke-width: 1.6; }
  .gate.on { stroke: var(--on); stroke-width: 2.4; }
  .box { fill: #d9dee5; stroke: #6b7785; stroke-width: 1.4; }
  .box.on { stroke: var(--on); stroke-width: 2.6; }
  .label { font-size: 11px; font-weight: 700; }
  .small { font-size: 8.5px; font-weight: 700; }
  .wl { font-size: 8.5px; font-weight: 700; }   /* a wire's name */
  .es { font-size: 11px; font-weight: 700; }    /* an enable or set entry */
  .clickable { cursor: pointer; }
  .clickable:hover { stroke: rgba(255, 138, 0, 0.9); }
  .mid { text-anchor: middle; dominant-baseline: central; }
  .end { text-anchor: end; }
  .none { pointer-events: none; }

  .module { stroke-width: 5; rx: 4; }
  .module.alu { fill: #fdf6ec; stroke: var(--alu-edge); }
  .module.ctrl { fill: #eff4fb; stroke: var(--gp-edge); }
  .module.ram { fill: #f0f8f3; stroke: var(--ctrl-edge); }
  .module-name { font-size: 15px; font-weight: 700; opacity: 0.55; }

  .alu-op { fill: #ffeed6; stroke: var(--alu-edge); stroke-width: 2; }
  .alu-op.on { stroke: var(--on); stroke-width: 3; }
  .alu-op-name { font-size: 15px; font-weight: 700; fill: var(--alu-ink); }

  /* Registers: three families, by the job the register does. */
  .reg .plate, .reg .tab { stroke-width: 3; }
  .reg .name, .reg .digit { font-weight: 700; }
  .reg .name { font-size: 15px; }
  .reg .digit { font-size: 22px; }
  .reg .cell { fill: transparent; stroke: rgba(31, 41, 51, 0.25); stroke-width: 1; cursor: pointer; }
  .reg .cell:hover { fill: rgba(255, 138, 0, 0.22); }
  .reg.latching .plate { stroke: var(--on); }
  .reg.gp .plate, .reg.gp .tab { fill: var(--gp-fill); stroke: var(--gp-edge); }
  .reg.gp text { fill: var(--gp-ink); }
  .reg.alu .plate, .reg.alu .tab { fill: var(--alu-fill); stroke: var(--alu-edge); }
  .reg.alu text { fill: var(--alu-ink); }
  .reg.ctrl .plate, .reg.ctrl .tab { fill: var(--ctrl-fill); stroke: var(--ctrl-edge); }
  .reg.ctrl text { fill: var(--ctrl-ink); }

  .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .hit:hover { stroke: rgba(255, 138, 0, 0.3); }
  .hit.held { stroke: rgba(255, 138, 0, 0.45); }

  .ram-cell { fill: #f4faf6; stroke: #6fa189; stroke-width: 0.8; }
  .ram-cell.used { fill: #ffffff; }
  .ram-cell.selected { fill: #ffe3e3; stroke: var(--on); stroke-width: 2.4; }
  .ram-text { font: 12.5px 'Cascadia Mono', Menlo, Consolas, monospace; fill: #234536; }
  .ram-bit { fill: transparent; cursor: pointer; }
  .ram-bit:hover { fill: rgba(255, 138, 0, 0.3); }
  .ram-head { font-size: 10px; fill: #234536; }
</style>
</head>
<body>

<header class="panel console">
  <div class="brand">
    <b>SCOTT DATA SYSTEMS 1</b>
    <span>X266 &middot; 8 BIT &middot; 256 WORDS</span>
    <span class="credit">Computer design &copy; John Clark Scott 2009,
      <a href="https://buthowdoitknow.com/">buthowdoitknow.com</a></span>
  </div>
  <div class="keys">
    <button class="key" id="run">START</button>
    <button class="key" id="stop">STOP</button>
    <button class="key" id="reset" title="Clear the registers. Memory stays.">RESET</button>
    <span class="sep"></span>
    <button class="key" id="back" title="Undo the last tick">BACK<br>TICK</button>
    <button class="key" id="tick" title="One quarter of a step">TICK</button>
    <button class="key" id="step" title="One stepper step, 4 ticks">SINGLE<br>STEP</button>
    <button class="key" id="instruction" title="One instruction, 6 steps">INSTR</button>
    <span class="sep"></span>
    <label class="field" for="speed">steps/s <input id="speed" type="number" min="1" max="200" value="2"></label>
    <label class="field" for="wire-color">wire <input id="wire-color" type="color" value="#e60000"></label>
    <span class="sep"></span>
    <button class="key" id="help">HELP</button>
    <button class="key" id="toggle-program">PROGRAM</button>
    <span class="readout" id="status">stopped</span>
  </div>
</header>

<main>
  <svg id="machine" viewBox="-4 -8 1938 1364" preserveAspectRatio="xMidYMid meet"></svg>
  <aside class="unit" id="program">
    <div class="unit-title">Assembler <span class="spacer"></span><span id="editor-mode">x266</span></div>
    <div class="unit-body">
      <div id="editor"></div>
      <textarea id="source" spellcheck="false" hidden></textarea>
      <div class="unit-keys">
        <button class="key" id="assemble">ASSEMBLE &amp; LOAD</button>
        <label class="field" for="origin">at <input id="origin" type="number" min="0" max="255" value="0"></label>
        <button class="key" id="sample">SAMPLE</button>
        <button class="key" id="clear-ram">CLEAR MEM</button>
      </div>
      <pre id="listing"></pre>
    </div>
  </aside>
</main>

<dialog id="help-dialog">
  <pre id="help-text"></pre>
  <form method="dialog"><button class="key">CLOSE</button></form>
</dialog>

<!-- Monaco loads from a pinned CDN copy, the same one cpu/mtmc-16 uses, so the
     13 MB editor is not checked in. The page works without it. -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
  const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/';
  if (window.require) {
    require.config({ paths: { vs: MONACO_BASE + 'vs' } });
    // Browsers refuse a cross-origin worker script, so the worker is a
    // same-origin data: URL that imports the CDN copy.
    window.MonacoEnvironment = {
      getWorkerUrl: function () {
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
          'self.MonacoEnvironment={baseUrl:"' + MONACO_BASE + '"};' +
          'importScripts("' + MONACO_BASE + 'vs/base/worker/workerMain.js");');
      }
    };
  }
</script>
<script type="module">
// ---------------------------------------------------------------------------
// 1. The simulator
//
// A net is one wire. A part reads nets and drives nets. settle() runs every
// part until no net changes. Registers are transparent latches, as in the
// book: while "set" is on, the register follows its input.
//
// Bit order follows the book: bit 0 is the most significant bit.
// ---------------------------------------------------------------------------

class Net {
  constructor(name) {
    this.name = name
    this.value = false   // what the machine drives
    this.held = false    // a presenter holds the wire on
    this.els = []        // the SVG elements that show this net
  }
  get on() { return this.value || this.held }
}

class Circuit {
  nets = new Map()
  parts = []
  changed = false

  net(name) {
    if (!this.nets.has(name)) this.nets.set(name, new Net(name))
    return this.nets.get(name)
  }
  word(name, n = 8) {
    return Array.from({ length: n }, (_, i) => this.net(`${name}${i}`))
  }
  add(part) {
    this.parts.push(part)
    return part
  }
  drive(net, value) {
    value = Boolean(value)
    if (net.value !== value) {
      net.value = value
      this.changed = true
    }
  }
  driveWord(nets, value) {
    nets.forEach((net, i) => this.drive(net, (value >> (nets.length - 1 - i)) & 1))
  }
  // A latch loop that never settles is possible with held wires. Real
  // hardware oscillates too, so the loop stops after a fixed count.
  settle() {
    for (let pass = 0; pass < 200; pass++) {
      this.changed = false
      for (const part of this.parts) part.update(this)
      if (!this.changed) return
    }
  }
}

const read = nets => nets.reduce((value, net) => (value << 1) | (net.on ? 1 : 0), 0)

class Gate {
  constructor(kind, inputs, out) {
    Object.assign(this, { kind, inputs, out })
  }
  update(c) {
    const ins = this.inputs.map(net => net.on)
    const value = {
      and: () => ins.every(Boolean),
      or: () => ins.some(Boolean),
      not: () => !ins[0],
      nand: () => !ins.every(Boolean),
    }[this.kind]()
    c.drive(this.out, value)
  }
}

class Decoder {
  constructor(inputs, outs, enable = null) {
    Object.assign(this, { inputs, outs, enable })
  }
  update(c) {
    const active = !this.enable || this.enable.on
    const selected = read(this.inputs)
    this.outs.forEach((net, i) => c.drive(net, active && i === selected))
  }
}

// A transparent latch. With "outs" the value is always visible on those nets.
// With "enable" the value goes to a bus only while enable is on.
class Register {
  value = 0
  constructor({ name, inputs, set, outs = null, enable = null, bus = null }) {
    Object.assign(this, { name, inputs, set, outs, enable })
    bus?.drivers.push(() => (this.enable.on ? this.value : 0))
  }
  update(c) {
    if (this.set.on) {
      const next = read(this.inputs)
      if (next !== this.value) {
        this.value = next
        c.changed = true
      }
    }
    if (this.outs) c.driveWord(this.outs, this.value)
  }
  reset() { this.value = 0 }
}

// Several parts share a bus. A part that is not enabled drives zeros, so the
// bus is the OR of its drivers.
class Bus {
  drivers = []
  constructor(nets) { this.nets = nets }
  update(c) {
    c.driveWord(this.nets, this.drivers.reduce((value, driver) => value | driver(), 0))
  }
}

// The "bus 1" part: passes its input, or the constant 1 while "one" is on.
class BusOne {
  constructor(inputs, one, outs) {
    Object.assign(this, { inputs, one, outs })
  }
  update(c) {
    c.driveWord(this.outs, this.one.on ? 1 : read(this.inputs))
  }
}

// The order of the ALU decoder outputs. Operation 7 is CMP: no block is
// enabled, so the ALU output is zero and only the flags matter.
const ALU_OPS = ['ADD', 'SHR', 'SHL', 'NOT', 'AND', 'OR', 'XOR']

class Alu {
  constructor(nets) {
    // nets: a, b, op, carryIn, select[8], blockOut{name: word}, out,
    //       carryOut, larger, equal, zero
    Object.assign(this, nets)
  }
  update(c) {
    const a = read(this.a)
    const b = read(this.b)
    const cin = this.carryIn.on ? 1 : 0
    const sum = a + b + cin
    const results = {
      ADD: [sum & 0xff, sum > 0xff],
      SHR: [(a >> 1) | (cin << 7), a & 1],
      SHL: [((a << 1) & 0xff) | cin, a & 0x80],
      NOT: [~a & 0xff, false],
      AND: [a & b, false],
      OR: [a | b, false],
      XOR: [a ^ b, false],
    }
    const selected = read(this.op)
    this.select.forEach((net, i) => c.drive(net, i === selected))
    let out = 0
    let carry = false
    ALU_OPS.forEach((name, i) => {
      const [value, carryBit] = results[name]
      c.driveWord(this.blockOut[name], value)
      if (i === selected) {
        out = value
        carry = Boolean(carryBit)
      }
    })
    c.driveWord(this.out, out)
    c.drive(this.carryOut, carry)
    c.drive(this.larger, a > b)
    c.drive(this.equal, a === b)
    c.drive(this.zero, out === 0)
  }
}

class Ram {
  cells = new Uint8Array(256)
  onWrite = () => {}
  constructor({ address, rows, cols, inputs, set, enable, bus }) {
    Object.assign(this, { address, rows, cols, inputs, set, enable })
    bus.drivers.push(() => (this.enable.on ? this.cells[this.selected] : 0))
  }
  get selected() { return read(this.address) }
  update(c) {
    const address = this.selected
    this.rows.forEach((net, i) => c.drive(net, i === address >> 4))
    this.cols.forEach((net, i) => c.drive(net, i === (address & 15)))
    if (this.set.on) {
      const next = read(this.inputs)
      if (next !== this.cells[address]) {
        this.cells[address] = next
        c.changed = true
        this.onWrite(address)
      }
    }
  }
}

// The clock and the stepper keep their own state, so tick() moves them and
// the circuit then settles. The stepper moves on the rising edge of clk,
// which is the same edge that turns clk e on. One step is 4 ticks:
//   tick 1: clk on, clk e on, the stepper moves to the next step
//   tick 2: clk s on
//   tick 3: clk off, clk s off
//   tick 4: clk e off; the stepper still shows the old step
// After a reset the stepper already shows step 1, so the first rising edge
// does not move it.
class Sequencer {
  phase = 0
  step = 0
  started = false
  constructor({ clk, clkE, clkS, steps }) {
    Object.assign(this, { clk, clkE, clkS, steps })
  }
  tick() {
    this.phase = (this.phase + 1) % 4
    if (this.phase === 1) {
      if (this.started) this.step = (this.step + 1) % 6
      this.started = true
    }
  }
  update(c) {
    c.drive(this.clk, this.phase === 1 || this.phase === 2)
    c.drive(this.clkE, this.phase !== 0)
    c.drive(this.clkS, this.phase === 2)
    this.steps.forEach((net, i) => c.drive(net, i === this.step))
  }
  reset() {
    this.phase = 0
    this.step = 0
    this.started = false
  }
}

// ---------------------------------------------------------------------------
// 2. Drawing
//
// Every wire, dot and gate is bound to a net. render() gives the "on" class
// to the elements of each net that is on. Nothing else colours the drawing.
// ---------------------------------------------------------------------------

const SVG_NS = 'http://www.w3.org/2000/svg'
const root = document.querySelector('#machine')

function el(tag, attrs = {}, parent = root, text = null) {
  const node = document.createElementNS(SVG_NS, tag)
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value)
  if (text !== null) node.textContent = text
  parent.appendChild(node)
  return node
}

// Later layers draw over earlier ones. Wires end under the shapes they feed.
const layers = Object.fromEntries(
  ['modules', 'wires', 'shapes', 'text', 'hits'].map(name => [name, el('g', { class: name })]))

const views = []   // functions that redraw state that is not a net

function bind(node, net) {
  net.els.push(node)
  return node
}

const wire = (net, d) => bind(el('path', { class: 'wire', d }, layers.wires), net)
const dot = (net, x, y) => bind(el('circle', { class: 'dot', cx: x, cy: y, r: 2.6 }, layers.wires), net)
const ribbon = (nets, path) => nets.forEach((net, i) => wire(net, path(i)))
const label = (x, y, text, cls = 'label') => el('text', { x, y, class: `${cls} none` }, layers.text, text)
const box = (x, y, w, h, cls = 'box') => el('rect', { x, y, width: w, height: h, class: cls }, layers.shapes)

function boxWithLabel(x, y, w, h, text, cls = 'label mid') {
  const rect = box(x, y, w, h)
  label(x + w / 2, y + h / 2, text, cls)
  return rect
}

// A gate at (x, y), the middle of its input edge. dir is the way it points:
// r, d, l or u. Returns the pin positions: { ins: [[x, y], ...], out: [x, y] }.
const GATE_W = 22
const ANGLE = { r: 0, d: 90, l: 180, u: 270 }

function gate(kind, x, y, dir, out, { n = 2, pitch = 6 } = {}) {
  const h = Math.max(14, (n - 1) * pitch + 8)
  const r = h / 2
  const w = kind === 'not' ? 14 : GATE_W
  const shapes = {
    and: `M0 ${-r} H${w - 7} A7 ${r} 0 0 1 ${w - 7} ${r} H0 Z`,
    nand: `M0 ${-r} H${w - 7} A7 ${r} 0 0 1 ${w - 7} ${r} H0 Z`,
    or: `M0 ${-r} Q${w * 0.6} ${-r} ${w} 0 Q${w * 0.6} ${r} 0 ${r} Q5 0 0 ${-r} Z`,
    not: `M0 -7 L${w} 0 L0 7 Z`,
  }
  const bubble = kind === 'not' || kind === 'nand'
  const g = el('g', { transform: `translate(${x} ${y}) rotate(${ANGLE[dir]})` }, layers.shapes)
  bind(el('path', { class: 'gate', d: shapes[kind] }, g), out)
  if (bubble) bind(el('circle', { class: 'gate', cx: w + 3, cy: 0, r: 3 }, g), out)

  const place = (lx, ly) => ({
    r: [x + lx, y + ly], d: [x - ly, y + lx], l: [x - lx, y - ly], u: [x + ly, y - lx],
  })[dir]
  const ins = Array.from({ length: n }, (_, i) => place(3, (i - (n - 1) / 2) * pitch))
  return { ins, out: place(bubble ? w + 6 : w, 0) }
}

// A transparent, wide copy of a wire. A click holds the wire on, and a second
// click lets it go. Two held enables put the OR of two values on the bus.
// Wires in the same group are exclusive: a hold on one releases the others.
const holds = new Map()   // net -> the hit elements of the net
const holdGroup = new Map()   // net -> group name

function holdable(net, d, group = null) {
  const node = el('path', { class: 'hit', d }, layers.hits)
  el('title', {}, node, `${net.name}: click to hold this wire on`)
  if (group) holdGroup.set(net, group)
  node.addEventListener('click', () => {
    const wasHeld = net.held
    if (group) for (const [other, g] of holdGroup) if (g === group) other.held = false
    net.held = !wasHeld
    refresh()
  })
  if (!holds.has(net)) holds.set(net, [])
  holds.get(net).push(node)
}

// A control wire: drawn, and holdable.
function control(net, d, group = null) {
  wire(net, d)
  holdable(net, d, group)
}

function render() {
  for (const net of circuit.nets.values()) {
    if (net.shown === net.on) continue
    net.shown = net.on
    for (const node of net.els) {
      node.classList.toggle('on', net.on)
      // A wire that is on goes over the wires that are off.
      if (net.on && node.parentNode === layers.wires) layers.wires.appendChild(node)
    }
  }
  for (const [net, nodes] of holds) {
    for (const node of nodes) node.classList.toggle('held', net.held)
  }
  for (const view of views) view()
}

function refresh() {
  circuit.settle()
  render()
}

// A register: a name tab and one cell per bit. A click on a cell flips the bit.
const CELL = 28
const REG_H = 40

// A vertical register can have wide cells (cellW) that hold a word above
// each digit. Its tab is then as wide as the cells.
function drawRegister(reg, { x, y, role, bits = 8, cell = CELL, tab = 'top', letters = null, vertical = false, cellW = null }) {
  const w = vertical ? (cellW ?? cell) : cell * bits
  const h = vertical ? cell * bits : REG_H
  const g = el('g', { class: `reg ${role}` }, layers.shapes)
  if (tab === 'vertical') {
    // A narrow tab above the plate, with the name reading upward.
    const tabH = reg.name.length * 9 + 12
    el('rect', { class: 'tab', x, y: y - tabH, width: 18, height: tabH, rx: 3 }, g)
    el('text', { class: 'name mid none', transform: `translate(${x + 9} ${y - tabH / 2}) rotate(-90)` }, g, reg.name)
  } else {
    const tabW = cellW ? w : reg.name.length * 11 + 14
    const tabY = tab === 'top' ? y - 20 : y + h
    el('rect', { class: 'tab', x, y: tabY, width: tabW, height: 20, rx: 3 }, g)
    const name = el('text', { class: 'name mid none', x: x + tabW / 2, y: tabY + 10 }, g, reg.name)
    if (cellW) name.style.fontSize = '12px'
  }
  el('rect', { class: 'plate', x, y, width: w, height: h }, g)

  const digits = []
  for (let i = 0; i < bits; i++) {
    const cx = vertical ? x : x + i * cell
    const cy = vertical ? y + i * cell : y
    const ch = vertical ? cell : h
    const digitY = cellW ? cy + ch / 2 + 6 : cy + ch / 2 + 1
    const digit = el('text', { class: 'digit mid none', x: cx + (vertical ? w : cell) / 2, y: digitY }, g, '0')
    if (vertical) digit.style.fontSize = cellW ? '15px' : '16px'
    if (letters && cellW) el('text', { class: 'wl mid none', x: cx + w / 2, y: cy + 8 }, g, letters[i])
    else if (letters) el('text', { class: 'small none', x: cx + 2, y: cy + 8 }, g, letters[i])
    digits.push(digit)
    const hit = el('rect', { class: 'cell', x: cx, y: cy, width: vertical ? w : cell, height: ch }, g)
    el('title', {}, hit, `${reg.name} bit ${i}: click to flip`)
    hit.addEventListener('click', () => {
      reg.value ^= 1 << (bits - 1 - i)
      refresh()
    })
  }
  views.push(() => {
    const text = reg.value.toString(2).padStart(bits, '0')
    digits.forEach((digit, i) => { digit.textContent = text[i] })
    g.classList.toggle('latching', reg.set.on)
  })
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, cellX: i => x + i * cell + cell / 2 }
}

// ---------------------------------------------------------------------------
// 3. The machine: bus, registers and ALU
//
// Each section makes its parts and draws them. Coordinates are in the units
// of the viewBox, 1920 wide.
// ---------------------------------------------------------------------------

const circuit = new Circuit()
const net = name => circuit.net(name)
const registers = []

function register(options, drawing) {
  const reg = circuit.add(new Register(options))
  registers.push(reg)
  reg.shape = drawRegister(reg, drawing)
  return reg
}

function module(x, y, w, h, role, name, at = 'bottom-left') {
  el('rect', { class: `module ${role}`, x, y, width: w, height: h }, layers.modules)
  const attrs = at === 'top-left'
    ? { x: x + 10, y: y + 24, class: 'module-name' }
    : { x: x + 10, y: y + h - 10, class: 'module-name' }
  el('text', attrs, layers.modules, name)
}

// --- the bus: a ring of 8 wires. Wire 0 is the outside wire. ---------------
const STEP = 5
const BUS = { top: 2, left: 6, bottom: 1029, right: 1924 }
const busNets = circuit.word('bus')
const bus = circuit.add(new Bus(busNets))

ribbon(busNets, i => {
  const o = i * STEP
  return `M${BUS.left + o} ${BUS.top + o} H${BUS.right - o} V${BUS.bottom - o} H${BUS.left + o} Z`
})

// A tap is 8 wires from a part to the ring. Each wire ends on its own ring
// wire, with a dot. x or y is the position of wire 0 of the tap.
const tap = {
  top(x, y) {
    ribbon(busNets, i => `M${x + i * STEP} ${BUS.top + i * STEP} V${y}`)
    busNets.forEach((n, i) => dot(n, x + i * STEP, BUS.top + i * STEP))
  },
  bottom(x, y) {
    ribbon(busNets, i => `M${x + i * STEP} ${BUS.bottom - i * STEP} V${y}`)
    busNets.forEach((n, i) => dot(n, x + i * STEP, BUS.bottom - i * STEP))
  },
  right(x, y) {
    ribbon(busNets, i => `M${BUS.right - i * STEP} ${y + i * STEP} H${x}`)
    busNets.forEach((n, i) => dot(n, BUS.right - i * STEP, y + i * STEP))
  },
}
const TAP_W = 7 * STEP

// --- TMP and bus 1 ------------------------------------------------------------
const tmpOut = circuit.word('tmp')
const aluB = circuit.word('alu b')
const TMP = { x: 90, y: 72 }
const tmp = register(
  { name: 'TMP', inputs: busNets, set: net('TMP s'), outs: tmpOut },
  { ...TMP, role: 'alu' })
const B_X = tmp.shape.cx - TAP_W / 2          // wire 0 of the B trunk
tap.top(B_X, TMP.y)
ribbon(tmpOut, i => `M${B_X + i * STEP} ${TMP.y + REG_H} V126`)
circuit.add(new BusOne(tmpOut, net('bus 1'), aluB))
bind(boxWithLabel(B_X - 10, 124, TAP_W + 20, 22, 'BUS 1'), net('bus 1'))

// --- the ALU -------------------------------------------------------------------
const ALU = {
  x: 60, y: 160, w: 490, h: 716,
  aX: 115,            // wire 0 of the A trunk, the right-hand wire
  blockX: 236, blockW: 100, blockH: 90, pitch: 94, top: 168,
  eX: 361, eW: 25,
  outX: 431,          // wire 0 of the output trunk
  laneX: 474,         // decoder select lanes, right of the trunk
  carryX: 498, equalX: 504, largerX: 510,
  decX: 514, decW: 30,
}
module(ALU.x, ALU.y, ALU.w, ALU.h, 'alu', 'ALU')

const DRAW_ORDER = ['XOR', 'OR', 'AND', 'NOT', 'SHR', 'SHL', 'ADD']
const TWO_INPUT = new Set(['XOR', 'OR', 'AND', 'ADD'])
const HAS_CARRY = new Set(['SHR', 'SHL', 'ADD'])

const aluNets = {
  a: busNets,
  b: aluB,
  op: circuit.word('alu op', 3),
  carryIn: net('carry in'),
  select: circuit.word('alu select', 8),
  blockOut: Object.fromEntries(ALU_OPS.map(name => [name, circuit.word(`${name} out`)])),
  out: circuit.word('alu out'),
  carryOut: net('carry out'),
  larger: net('a larger'),
  equal: net('equal'),
  zero: net('zero'),
}
circuit.add(new Alu(aluNets))

function opShape(name, x, top, w, h) {
  const bot = top + h
  const cy = top + h / 2
  const r = x + w
  return {
    XOR: `M${x} ${top} Q${x + w * 0.7} ${top} ${r} ${cy} Q${x + w * 0.7} ${bot} ${x} ${bot} Q${x + 18} ${cy} ${x} ${top} Z`,
    OR: `M${x} ${top} Q${x + w * 0.7} ${top} ${r} ${cy} Q${x + w * 0.7} ${bot} ${x} ${bot} Q${x + 18} ${cy} ${x} ${top} Z`,
    AND: `M${x} ${top} H${r - 37} A37 ${h / 2} 0 0 1 ${r - 37} ${bot} H${x} Z`,
    NOT: `M${x} ${top} L${r} ${cy - 22} V${cy + 22} L${x} ${bot} Z`,
    // The shifters lean the way the bits move: bit 0 is the top wire, so a
    // shift right moves every bit one wire down.
    SHR: `M${x} ${top} L${r} ${top + 16} V${bot} L${x} ${bot - 16} Z`,
    SHL: `M${x} ${top + 16} L${r} ${top} V${bot - 16} L${x} ${bot} Z`,
    ADD: `M${x} ${top} L${r} ${top + 6} V${bot - 6} L${x} ${bot} V${cy + 9} L${x + 14} ${cy} L${x} ${cy - 9} Z`,
  }[name]
}

const blocks = DRAW_ORDER.map((name, k) => {
  const top = ALU.top + k * ALU.pitch
  return { name, top, cy: top + ALU.blockH / 2, select: aluNets.select[ALU_OPS.indexOf(name)] }
})
const lastBlock = blocks.at(-1)
const aTapY = (block, i) => block.top + (TWO_INPUT.has(block.name) ? 8 : 27.5) + i * STEP
const bTapY = (block, i) => block.top + 52 + i * STEP
const outY = (block, i) => block.cy - TAP_W / 2 + i * STEP

// The A trunk comes from the left side of the ring. The B trunk comes from bus 1.
const A_TAP_Y = 166   // above the first XOR tap, so every tap sits on the trunk
ribbon(busNets, i =>
  `M${BUS.left + i * STEP} ${A_TAP_Y + i * STEP} H${ALU.aX - i * STEP} V${aTapY(lastBlock, i)}`)
busNets.forEach((n, i) => dot(n, BUS.left + i * STEP, A_TAP_Y + i * STEP))
ribbon(aluB, i => `M${B_X + i * STEP} 146 V${bTapY(lastBlock, i)}`)

// The output trunk runs down to ACC.
const ACC = { x: ALU.outX + TAP_W / 2 - CELL * 4, y: 930 }
ribbon(aluNets.out, i => `M${ALU.outX + i * STEP} ${outY(blocks[0], i)} V${ACC.y}`)

for (const block of blocks) {
  const { name, top, cy, select } = block
  const last = block === lastBlock
  // XOR and OR have a curved input edge, so their wires run deeper.
  const inX = ALU.blockX + (name === 'XOR' || name === 'OR' ? 22 : 12)
  ribbon(busNets, i => `M${ALU.aX - i * STEP} ${aTapY(block, i)} H${inX}`)
  if (!last) busNets.forEach((n, i) => dot(n, ALU.aX - i * STEP, aTapY(block, i)))
  if (TWO_INPUT.has(name)) {
    ribbon(aluB, i => `M${B_X + i * STEP} ${bTapY(block, i)} H${inX}`)
    if (!last) aluB.forEach((n, i) => dot(n, B_X + i * STEP, bTapY(block, i)))
  }

  bind(el('path', { class: 'alu-op', d: opShape(name, ALU.blockX, top, ALU.blockW, ALU.blockH) },
    layers.shapes), select)
  label(ALU.blockX + 45, cy, name, 'alu-op-name mid')

  // block -> enabler -> output trunk
  const carry = HAS_CARRY.has(name)
  const eTop = cy - 23
  const eH = 46
  ribbon(aluNets.blockOut[name], i => `M${ALU.blockX + 70} ${outY(block, i)} H${ALU.eX}`)
  ribbon(aluNets.out, i => `M${ALU.eX + ALU.eW} ${outY(block, i)} H${ALU.outX + i * STEP}`)
  if (block !== blocks[0]) aluNets.out.forEach((n, i) => dot(n, ALU.outX + i * STEP, outY(block, i)))
  bind(boxWithLabel(ALU.eX, eTop, ALU.eW, eH, 'E'), select)
  if (carry) {
    // The carry leaves where the shifted-out bit is: the bottom for SHR
    // and ADD, the top for SHL. Either way it passes clear of the enabler.
    const y = name === 'SHL' ? top + 8 : top + 66
    wire(aluNets.carryOut, `M${ALU.blockX + 70} ${y} H${ALU.carryX}`)
    if (name === 'SHL') dot(aluNets.carryOut, ALU.carryX, y)   // SHR and ADD end the trunk
  }
}

// The 3x8 decoder picks one enabler. Each select runs down a lane right of
// the output trunk, then crosses the trunk once, just above its own block's
// output ribbon. The lanes nest outward from the decoder, so no select
// crosses another lane. The upper and lower blocks never overlap in height,
// so they share the three lanes.
const DEC = { y: 330, h: 190 }
boxWithLabel(ALU.decX, DEC.y, ALU.decW, DEC.h, '3x8')
const decOutY = [8, 16, 24, 32, 158, 166, 174, 182].map(dy => DEC.y + dy)
const SELECT_LANE = { AND: 0, OR: 1, XOR: 2, NOT: 0, SHR: 0, SHL: 1, ADD: 2 }
blocks.forEach((block, k) => {
  const laneX = ALU.laneX + SELECT_LANE[block.name] * 8
  const pinX = ALU.eX + ALU.eW / 2
  const y = decOutY[k]
  // cy - 36 keeps clear of the SHL carry out, which leaves at cy - 29.
  wire(block.select, `M${ALU.decX} ${y} H${laneX} V${block.cy - 36} H${pinX} V${block.cy - 23}`)
})
label(ALU.decX + 2, decOutY[7] + 3, 'cmp', 'wl')

// Carry, equal and a-larger run down the right of the output trunk to FLAGS.
const FLAGS = { x: 588, y: 722, cell: 30, w: 44 }
const flagY = i => FLAGS.y + FLAGS.cell * i + FLAGS.cell / 2
const shr = blocks.find(b => b.name === 'SHR')
// The carry trunk runs from SHR down to ADD, and a T at the flag height
// goes to FLAGS.
const add = blocks.find(b => b.name === 'ADD')
wire(aluNets.carryOut, `M${ALU.carryX} ${shr.top + 66} V${add.top + 66}`)
wire(aluNets.carryOut, `M${ALU.carryX} ${flagY(0)} H${FLAGS.x}`)
dot(aluNets.carryOut, ALU.carryX, flagY(0))
wire(aluNets.larger, `M${ALU.blockX + 20} ${blocks[0].top + 66} H${ALU.largerX} V${flagY(1)} H${FLAGS.x}`)
wire(aluNets.equal, `M${ALU.blockX + 20} ${blocks[0].top + 71} H${ALU.equalX} V${flagY(2)} H${FLAGS.x}`)
label(ALU.blockX + 108, blocks[0].top + 64, 'a larger', 'wl')
label(ALU.blockX + 108, blocks[0].top + 79, 'equal', 'wl')

// Z is on when every output wire is off.
const Z_BOX = { x: 476, y: 824, w: 35, h: 43 }
ribbon(aluNets.out, i => `M${ALU.outX + i * STEP} ${828 + i * STEP} H${Z_BOX.x}`)
aluNets.out.forEach((n, i) => dot(n, ALU.outX + i * STEP, 828 + i * STEP))
bind(boxWithLabel(Z_BOX.x, Z_BOX.y, Z_BOX.w, Z_BOX.h, 'Z'), aluNets.zero)
wire(aluNets.zero, `M${Z_BOX.x + Z_BOX.w} 845 H580 V${flagY(3)} H${FLAGS.x}`)

// The carry input goes to the three blocks that use it.
const CARRY_LANE = 235
const CARRY_Y = 900   // clear of the ACC name tab below
// The carry enters SHR at the top: it becomes bit 0, the top wire.
wire(aluNets.carryIn, `M596 ${CARRY_Y} H${CARRY_LANE} V${shr.top + 12} H${ALU.blockX + 8}`)
for (const block of blocks.filter(b => b.name === 'SHL' || b.name === 'ADD')) {
  // SHL takes the carry low on its left edge, but clear of the carry wire
  // that runs to FLAGS at the same height.
  const y = block.name === 'ADD' ? block.cy : block.top + 60
  wire(aluNets.carryIn, `M${CARRY_LANE} ${y} H${ALU.blockX + 16}`)
  dot(aluNets.carryIn, CARRY_LANE, y)
}
label(CARRY_LANE + 4, CARRY_Y - 4, 'carry in', 'wl')

// --- ACC, FLAGS and the carry latch -------------------------------------------------
const acc = register(
  { name: 'ACC', inputs: aluNets.out, set: net('ACC s'), enable: net('ACC e'), bus },
  { ...ACC, role: 'alu' })
tap.bottom(ALU.outX, ACC.y + REG_H)

const flagOut = ['flag C', 'flag A', 'flag E', 'flag Z'].map(net)
const flags = register(
  { name: 'FLAGS', inputs: [aluNets.carryOut, aluNets.larger, aluNets.equal, aluNets.zero],
    set: net('FLAGS s'), outs: flagOut },
  { ...FLAGS, role: 'alu', bits: 4, vertical: true, cellW: FLAGS.w, letters: ['carry', 'larger', 'equal', 'zero'] })

// The carry flag feeds the ALU, and the ALU sets the carry flag. The latch
// keeps the old carry steady while FLAGS takes the new one.
const C_TMP = { x: 626, y: 898, w: 24, h: 24 }
const carryLatch = circuit.add(new Register(
  { name: 'C TMP', inputs: [flagOut[0]], set: net('TMP s'), outs: [net('c tmp')] }))
registers.push(carryLatch)
bind(box(C_TMP.x, C_TMP.y, C_TMP.w, C_TMP.h), net('c tmp'))
label(C_TMP.x + 12, C_TMP.y + 12, 'C', 'label mid')
label(C_TMP.x + 27, C_TMP.y + 8, 'tmp', 'wl')

// ---------------------------------------------------------------------------
// 4. The control unit
//
// The control logic is two tables. TERMS says when something happens: a
// stepper step ANDed with an instruction class. OUTPUTS says what happens:
// each control wire is the OR of its terms, ANDed with clk e or clk s.
//
// The drawing is the same two tables. The AND plane is in the middle: one
// gate per term, its inputs on columns to the right. The OR plane is on the
// left, and the finished control wires leave it at the bottom. IR sits at the
// bottom right under the class decoder, and its bits rise to feed the columns.
// ---------------------------------------------------------------------------

const CU = { x: 668, y: 126, w: 1210, h: 860 }
module(CU.x, CU.y, CU.w, CU.h, 'ctrl', 'CONTROL UNIT')

// --- IR -------------------------------------------------------------------------
const irOut = circuit.word('ir')
const IR = { x: 1534, y: 918 }
const ir = register(
  { name: 'IR', inputs: busNets, set: net('IR s'), outs: irOut },
  { ...IR, role: 'ctrl', tab: 'bottom' })
tap.bottom(ir.shape.cx - TAP_W / 2, IR.y + REG_H)
const irX = i => ir.shape.cellX(i)
// Bits 4 to 7 jog 20 px right just above the register, which leaves room
// for a wider class decoder. irCol(i) is the x of the wire that rises.
const IR_JOG = 20
const irJogY = i => 898 + (i - 4) * 5
const irCol = i => (i < 4 ? irX(i) : irX(i) + IR_JOG)
const irTop = Array(8).fill(IR.y)   // how far up each bit's wire runs
const irTaps = []                    // [bit, y] of every branch, for the dots
function irBranch(i, y, d) {
  if (d) wire(irOut[i], `M${irCol(i)} ${y} ${d}`)
  irTop[i] = Math.min(irTop[i], y)
  irTaps.push([i, y])
}

// --- clock and stepper ---------------------------------------------------------
const steps = ['s1', 's2', 's3', 's4', 's5', 's6'].map(net)
const sequencer = circuit.add(new Sequencer(
  { clk: net('clk'), clkE: net('clk e'), clkS: net('clk s'), steps }))

// The clock sits left of the OR plane, so clk e and clk s reach the clock
// gates with no crossing. The stepper sits above the rows; its steps run down.
const CLOCK = { x: 696, y: 767, w: 60, h: 45 }
const STEPPER = { x: 1380, y: 292, w: 134, h: 40 }
const CLK_E = { y: 798 }
const CLK_S = { y: 788 }
{
  // A click on the clock moves it one phase. A click on the stepper moves it
  // one step. Both leave the rest of the machine alone.
  const clock = box(CLOCK.x, CLOCK.y, CLOCK.w, CLOCK.h, 'box clickable')
  el('title', {}, clock, 'click: next clock phase')
  clock.addEventListener('click', () => {
    remember()
    sequencer.phase = (sequencer.phase + 1) % 4
    refresh()
  })
  label(CLOCK.x + CLOCK.w / 2, CLOCK.y + 12, 'CLOCK', 'label mid')
  const stepper = boxWithLabel(STEPPER.x, STEPPER.y, STEPPER.w, STEPPER.h, 'STEPPER')
  stepper.setAttribute('class', 'box clickable')
  el('title', {}, stepper, 'click: next step')
  stepper.addEventListener('click', () => {
    remember()
    sequencer.step = (sequencer.step + 1) % 6
    sequencer.started = true
    refresh()
  })
}
wire(net('clk'), `M726 ${CLOCK.y} V306 H${STEPPER.x}`)
label(730, 648, 'clk', 'wl')
label(CLOCK.x + CLOCK.w - 3, CLK_S.y + 3, 'clk s', 'wl end')
label(CLOCK.x + CLOCK.w - 3, CLK_E.y + 3, 'clk e', 'wl end')

// --- the AND plane columns --------------------------------------------------------
// name -> { net, x, feed }. A column runs from its feed, above or below the
// rows, to the farthest row that uses it.
const columns = new Map()
const column = (name, n, x, feed) => columns.set(name, { net: n, x, feed, lo: Infinity, hi: -Infinity })
const useColumn = (col, y) => {
  col.lo = Math.min(col.lo, y)
  col.hi = Math.max(col.hi, y)
}

// ir0 on means an ALU instruction. If ir0 is off, ir1 to ir3 pick the class.
const CLASSES = ['LD', 'ST', 'DATA', 'JMPR', 'JMP', 'JCAEZ', 'CLF', 'IO']
const IDEC = { x: 1568, y: 808, w: 106, h: 34 }
const notIr0 = net('not ir0')
const classNets = CLASSES.map(net)
circuit.add(new Gate('not', [irOut[0]], notIr0))
circuit.add(new Decoder(irOut.slice(1, 4), classNets, notIr0))
boxWithLabel(IDEC.x, IDEC.y, IDEC.w, IDEC.h, '3x8')
{
  // The enable is a NOT on bit 0, above the REG lanes. Its output enters the
  // decoder from the left side.
  const pins = gate('not', irX(0), 728, 'u', notIr0)
  irBranch(0, pins.ins[0][1])
  wire(notIr0, `M${pins.out[0]} ${pins.out[1]} V${IDEC.y + 8} H${IDEC.x}`)
}
// Bits 1 to 3 rise straight into the decoder.
;[1, 2, 3].forEach(i => irBranch(i, IDEC.y + IDEC.h))
CLASSES.forEach((name, k) => column(name, classNets[k], IDEC.x + 8 + k * 13, IDEC.y))
steps.forEach((n, k) => column(n.name, n, STEPPER.x + 25 + k * 17, STEPPER.y + STEPPER.h))

// The ALU column leaves bit 0 below the op branches and rises left of the steps.
const ALU_BRANCH_Y = 912
irBranch(0, ALU_BRANCH_Y, 'H1420')
column('ALU', irOut[0], 1420, ALU_BRANCH_Y)

// CMP is ALU operation 111. It must not write its result to a register.
// Its NAND taps the three op branches below.
const notCmp = net('not CMP')
circuit.add(new Gate('nand', irOut.slice(1, 4), notCmp))
const cmpGate = gate('nand', 1400, 842, 'u', notCmp, { n: 3, pitch: 5 })
column('!CMP', notCmp, cmpGate.out[0], cmpGate.out[1])
const MATCH_X = 1822
column('MATCH', net('match'), MATCH_X, 720)

// --- the ALU operation wires ------------------------------------------------------
// op = ir1..ir3, but only during step 5 of an ALU instruction. The three bits
// run along the bottom of the control unit to the gates beside the ALU.
const aluEnable = net('ALU en')
const ALU_EN_X = 665
const opGateY = k => 370 + k * 30
const OP_BRANCH_Y = k => 908 - k * 4
;[1, 2, 3].forEach((i, k) => {
  const y = opGateY(k)
  const laneX = 678 + k * 5
  const pins = gate('and', 658, y, 'l', aluNets.op[k])
  circuit.add(new Gate('and', [irOut[i], aluEnable], aluNets.op[k]))
  irBranch(i, OP_BRANCH_Y(k), `H${laneX} V${pins.ins[1][1]} H${pins.ins[1][0]}`)
  const [cx, cy] = cmpGate.ins[k]
  wire(irOut[i], `M${cx} ${OP_BRANCH_Y(k)} V${cy}`)
  dot(irOut[i], cx, OP_BRANCH_Y(k))
  wire(aluEnable, `M${ALU_EN_X} ${pins.ins[0][1]} H${pins.ins[0][0]}`)
  if (k > 0) dot(aluEnable, ALU_EN_X, pins.ins[0][1])
  control(aluNets.op[k], `M${pins.out[0]} ${y} H${ALU.decX + ALU.decW}`)
})
label(ALU.decX + ALU.decW - 3, opGateY(0) - 6, 'op', 'wl end')

// --- the two tables ---------------------------------------------------------------
const TERMS = {
  'fetch 1': ['s1'],
  'fetch 2': ['s2'],
  'fetch 3': ['s3'],
  'ALU 4': ['s4', 'ALU'],
  'ALU 5': ['s5', 'ALU'],
  'ALU 6': ['s6', 'ALU', '!CMP'],
  'LD 4': ['s4', 'LD'],
  'LD 5': ['s5', 'LD'],
  'ST 4': ['s4', 'ST'],
  'ST 5': ['s5', 'ST'],
  'DATA 4': ['s4', 'DATA'],
  'DATA 5': ['s5', 'DATA'],
  'DATA 6': ['s6', 'DATA'],
  'JMPR 4': ['s4', 'JMPR'],
  'JMP 4': ['s4', 'JMP'],
  'JMP 5': ['s5', 'JMP'],
  'JCAEZ 4': ['s4', 'JCAEZ'],
  'JCAEZ 5': ['s5', 'JCAEZ'],
  'JCAEZ 6': ['s6', 'JCAEZ', 'MATCH'],
  'CLF 4': ['s4', 'CLF'],
}

// Outputs from left to right. "clock" is e, s or null for a wire with no clock.
const OUTPUTS = [
  { name: 'ALU en', clock: null, terms: ['ALU 5'] },
  { name: 'bus 1', clock: null, terms: ['fetch 1', 'DATA 4', 'JCAEZ 4', 'CLF 4'] },
  { name: 'TMP s', clock: 's', terms: ['ALU 4'] },
  { name: 'ACC s', clock: 's', terms: ['fetch 1', 'ALU 5', 'DATA 4', 'JCAEZ 4'] },
  { name: 'ACC e', clock: 'e', terms: ['fetch 3', 'ALU 6', 'DATA 6', 'JCAEZ 5'] },
  { name: 'FLAGS s', clock: 's', terms: ['ALU 5', 'CLF 4'] },
  { name: 'IR s', clock: 's', terms: ['fetch 2'] },
  { name: 'IAR e', clock: 'e', terms: ['fetch 1', 'DATA 4', 'JMP 4', 'JCAEZ 4'] },
  { name: 'IAR s', clock: 's', terms: ['fetch 3', 'DATA 6', 'JMPR 4', 'JMP 5', 'JCAEZ 5', 'JCAEZ 6'] },
  { name: 'MAR s', clock: 's', terms: ['fetch 1', 'LD 4', 'ST 4', 'DATA 4', 'JMP 4', 'JCAEZ 4'] },
  { name: 'RAM e', clock: 'e', terms: ['fetch 2', 'LD 5', 'DATA 5', 'JMP 5', 'JCAEZ 6'] },
  { name: 'RAM s', clock: 's', terms: ['ST 5'] },
  { name: 'SRC e', clock: 'e', terms: ['ALU 5', 'LD 4', 'ST 4'] },
  { name: 'DST e', clock: 'e', terms: ['ALU 4', 'ST 5', 'JMPR 4'] },
  { name: 'DST s', clock: 's', terms: ['ALU 6', 'LD 5', 'DATA 5'] },
]

// --- the AND plane: one row for each term, gates pointing left -----------------------
const PLANE = { rowY: 326, rowPitch: 20, gateX: 1300, orX: 760, orY: 762, andY: 802, outY: 824 }
const TERM_X = PLANE.gateX - GATE_W     // where a term wire starts
const termNets = {}
const termRows = {}

Object.entries(TERMS).forEach(([name, inputs], r) => {
  const y = PLANE.rowY + r * PLANE.rowPitch
  termRows[name] = y
  const cols = inputs.map(input => columns.get(input)).sort((a, b) => a.x - b.x)
  if (cols.length === 1) {
    // A term with one input needs no gate: the step wire is the term.
    const [col] = cols
    termNets[name] = col.net
    wire(col.net, `M${col.x} ${y} H${TERM_X}`)
    dot(col.net, col.x, y)
    useColumn(col, y)
    return
  }
  const out = termNets[name] = net(name)
  circuit.add(new Gate('and', cols.map(col => col.net), out))
  const pins = gate('and', PLANE.gateX, y, 'l', out, { n: cols.length, pitch: cols.length > 2 ? 4 : 6 })
  cols.forEach((col, i) => {
    const [pinX, pinY] = pins.ins[i]
    wire(col.net, `M${col.x} ${pinY} H${pinX}`)
    dot(col.net, col.x, pinY)
    useColumn(col, pinY)
  })
})

// --- the OR plane: one group of wires for each output -----------------------------
const termReach = {}     // how far left each term wire runs
const outputPins = {}    // name -> [x, y], where the finished control wire starts
let groupX = PLANE.orX

for (const { name, clock, terms } of OUTPUTS) {
  const n = terms.length
  const width = Math.max(6 * n + 10, 30)
  const gx = groupX + width / 2 - 3
  groupX += width
  const out = net(name)
  const sorted = [...terms].sort((a, b) => termRows[a] - termRows[b])

  // the OR of the terms
  let sum = termNets[sorted[0]]
  let sumY = PLANE.orY
  if (n > 1) {
    sum = clock ? net(`${name} terms`) : out
    circuit.add(new Gate('or', sorted.map(t => termNets[t]), sum))
    const pins = gate('or', gx, PLANE.orY, 'd', sum, { n, pitch: 5 })
    sorted.forEach((t, i) => {
      const [x, y] = pins.ins[i]
      wire(termNets[t], `M${x} ${termRows[t]} V${y}`)
      termReach[t] = Math.min(termReach[t] ?? Infinity, x)
      dot(termNets[t], x, termRows[t])
    })
    sumY = pins.out[1]
  } else {
    wire(sum, `M${gx} ${termRows[sorted[0]]} V${PLANE.orY}`)
    termReach[sorted[0]] = Math.min(termReach[sorted[0]] ?? Infinity, gx)
    dot(sum, gx, termRows[sorted[0]])
    if (!clock) circuit.add(new Gate('or', [sum], out))
  }

  // the clock gate
  if (clock) {
    const clk = clock === 'e' ? CLK_E : CLK_S
    const clkNet = net(`clk ${clock}`)
    circuit.add(new Gate('and', [sum, clkNet], out))
    const pins = gate('and', gx + 3, PLANE.andY, 'd', out)
    wire(sum, `M${gx} ${sumY} V${pins.ins[1][1]}`)
    wire(clkNet, `M${pins.ins[0][0]} ${clk.y} V${pins.ins[0][1]}`)
    dot(clkNet, pins.ins[0][0], clk.y)
    clk.reach = Math.max(clk.reach ?? 0, pins.ins[0][0])
    wire(out, `M${pins.out[0]} ${pins.out[1]} V${PLANE.outY}`)
    outputPins[name] = [pins.out[0], PLANE.outY]
  } else {
    wire(out, `M${gx} ${sumY} V${PLANE.outY}`)
    outputPins[name] = [gx, PLANE.outY]
  }
  const text = label(0, 0, name, 'wl')
  text.setAttribute('transform', `translate(${outputPins[name][0] - 10} ${PLANE.outY + 4}) rotate(90)`)
}

for (const [name, reach] of Object.entries(termReach)) {
  wire(termNets[name], `M${TERM_X} ${termRows[name]} H${reach}`)
}
wire(net('clk e'), `M${CLOCK.x + CLOCK.w} ${CLK_E.y} H${CLK_E.reach}`)
wire(net('clk s'), `M${CLOCK.x + CLOCK.w} ${CLK_S.y} H${CLK_S.reach}`)

// --- jump condition: FLAGS against ir4..ir7 ----------------------------------------
// One AND gate hangs beside each of the four IR wires. The flag wires come
// from the ALU side, above the class decoder.
const MATCH = { gateY: 767, orX: 1794, orY: 832 }
const flagLaneY = i => 737 + i * 5
const flagJogX = i => 644 + i * 5
const matchOr = gate('or', MATCH.orX, MATCH.orY, 'r', net('match'), { n: 4, pitch: 5 })
const matchTerms = flagOut.map((flag, i) => {
  const out = net(`match ${'CAEZ'[i]}`)
  const bit = i + 4
  circuit.add(new Gate('and', [irOut[bit], flag], out))
  const pins = gate('and', irCol(bit) + 12, MATCH.gateY, 'd', out)
  irBranch(bit, pins.ins[1][1], `H${pins.ins[1][0]}`)
  wire(flag, `M${FLAGS.x + FLAGS.w} ${flagY(i)} H${flagJogX(i)} V${flagLaneY(i)} H${pins.ins[0][0]} V${pins.ins[0][1]}`)
  const [orX, orY] = matchOr.ins[3 - i]
  wire(out, `M${pins.out[0]} ${pins.out[1]} V${orY} H${orX}`)
  return out
})
circuit.add(new Gate('or', matchTerms, net('match')))
wire(net('match'), `M${matchOr.out[0]} ${MATCH.orY} H${MATCH_X}`)

// The carry flag also feeds the carry latch beside the ALU.
wire(flagOut[0], `M${flagJogX(0)} ${flagY(0)} V${C_TMP.y - 6} H${C_TMP.x + 12} V${C_TMP.y}`)
dot(flagOut[0], flagJogX(0), flagY(0))

// The columns themselves, now that each one knows how far up it runs.
for (const [name, col] of columns) {
  const fromTop = col.feed < PLANE.rowY
  // A column no term uses (IO) is a short stub.
  const far = col.lo === Infinity ? col.feed - 20 : fromTop ? col.hi : col.lo
  const d = `M${col.x} ${col.feed} V${far}`
  if (name.startsWith('s')) control(col.net, d, 'step')
  else wire(col.net, d)
  if (fromTop) {
    // A step number sits beside its wire where it leaves the stepper.
    label(col.x + 2, col.feed + 10, name.replace(/^s/, ''), 'wl')
    continue
  }
  const text = label(0, 0, name.replace('!', 'not '), 'wl')
  text.setAttribute('transform', `translate(${col.x - 4} ${IDEC.y - 6}) rotate(-90)`)
}

// The carry latch feeds the ALU only while the ALU is in use.
{
  const pins = gate('and', 616, CARRY_Y, 'l', aluNets.carryIn)
  circuit.add(new Gate('and', [net('c tmp'), aluEnable], aluNets.carryIn))
  wire(net('c tmp'), `M${C_TMP.x} ${pins.ins[1][1]} H${pins.ins[1][0]}`)
  wire(aluEnable, `M${ALU_EN_X} ${CARRY_Y + 15} H620 V${pins.ins[0][1]} H${pins.ins[0][0]}`)
}

// --- control wires that leave at the bottom -------------------------------------------
const lane = i => PLANE.outY + 40 + i * 4
const from = name => `M${outputPins[name].join(' ')}`

control(aluEnable, `${from('ALU en')} V${lane(0)} H${ALU_EN_X}`)
wire(aluEnable, `M${ALU_EN_X} ${opGateY(0) + 3} V${CARRY_Y + 15}`)
dot(aluEnable, ALU_EN_X, lane(0))

control(net('bus 1'), `${from('bus 1')} V${lane(1)} H560 V135 H${B_X + TAP_W + 10}`)

control(net('TMP s'), `${from('TMP s')} V${lane(2)} H570 V${TMP.y + 20} H${TMP.x + CELL * 8}`)
label(TMP.x + CELL * 8 + 4, TMP.y + 17, 's', 'es')
wire(net('TMP s'), `M570 ${lane(2)} V${C_TMP.y + C_TMP.h + 10} H${C_TMP.x + 12} V${C_TMP.y + C_TMP.h}`)
dot(net('TMP s'), 570, lane(2))

control(net('ACC s'), `${from('ACC s')} V${lane(3)} H656 V${ACC.y + 12} H${ACC.x + CELL * 8}`)
control(net('ACC e'), `${from('ACC e')} V${lane(4)} H660 V${ACC.y + 28} H${ACC.x + CELL * 8}`)
label(ACC.x + CELL * 8 + 4, ACC.y + 9, 's', 'es')
label(ACC.x + CELL * 8 + 4, ACC.y + 26, 'e', 'es')
control(net('FLAGS s'), `${from('FLAGS s')} V${lane(5)} H${FLAGS.x + 12} V${FLAGS.y + FLAGS.cell * 4}`)
label(FLAGS.x + 15, FLAGS.y + FLAGS.cell * 4 + 12, 's', 'es')
control(net('IR s'), `${from('IR s')} V${lane(6)} H${irX(3) + 14} V${IR.y}`)
label(irX(3) + 11, IR.y - 3, 's', 'es end')

// --- IAR: under its own two output wires ------------------------------------------------
const IAR = { x: outputPins['IAR s'][0] - 214, y: 918 }
const iar = register(
  { name: 'IAR', inputs: busNets, set: net('IAR s'), enable: net('IAR e'), bus },
  { ...IAR, role: 'ctrl', tab: 'bottom' })
tap.bottom(iar.shape.cx - TAP_W / 2, IAR.y + REG_H)
control(net('IAR e'), `${from('IAR e')} V${IAR.y}`)
control(net('IAR s'), `${from('IAR s')} V${IAR.y}`)
label(outputPins['IAR e'][0] + 3, IAR.y - 3, 'e', 'es')
label(outputPins['IAR s'][0] + 3, IAR.y - 3, 's', 'es')

// --- R0 to R3 and their select logic -------------------------------------------------------
// The registers sit in the top row. Under each one, three AND gates pick it:
// SRC enable, DST enable and DST set, each ANDed with a decoder line.
// The decoders sit at the top right, on the IR wires; their lines run left.
// SRC is the first register field of an instruction, DST the second.
const REGS = { x: 700, pitch: 269, y: 72, gateY: 190, orY: 150 }
const LANE = { a: j => 233 + j * 5, b: j => 204 + j * 5, reg: i => 276 + i * 5, turnX: i => 1860 + i * 5 }
// Decoder B sits higher and to the right, so its lines pass over decoder A
// and the IR wires into A pass under B's lines.
const DEC_A = { x: 1752, y: 228, w: 48, h: 23 }
const DEC_B = { x: 1806, y: 199, w: 48, h: 27 }
const decSrc = circuit.word('src reg', 4)
const decDst = circuit.word('dst reg', 4)
circuit.add(new Decoder(irOut.slice(4, 6), decSrc))
circuit.add(new Decoder(irOut.slice(6, 8), decDst))
boxWithLabel(DEC_A.x, DEC_A.y, DEC_A.w, DEC_A.h, 'SRC 2x4', 'small mid')
boxWithLabel(DEC_B.x, DEC_B.y, DEC_B.w, DEC_B.h, 'DST 2x4', 'small mid')
// Bits 4 to 7 jog right above the stepper and rise into the decoders. Bit 4
// turns first and highest, so no jog crosses another bit's wire.
const IR_JOG_Y = i => 254 + (i - 4) * 5
;[[4, DEC_A], [5, DEC_A], [6, DEC_B], [7, DEC_B]].forEach(([i, dec]) => {
  const x = dec.x + 10 + (i % 2) * 28
  irBranch(i, IR_JOG_Y(i), `H${x} V${dec.y + dec.h}`)
})

// The gates sit in the left half of each plate, clear of the decoders.
const gateXs = n => {
  const cx = REGS.x + n * REGS.pitch + CELL * 4
  return { a: cx - 80, b: cx - 48, s: cx - 10, or: cx - 64 }
}
const first = gateXs(0)

const regLanes = ['SRC e', 'DST e', 'DST s'].map((name, i) => {
  const y = LANE.reg(i)
  const bottomY = PLANE.outY + 32 - i * 4
  const n = net(name)
  const endX = [first.a, first.b, first.s][i] - 3
  wire(n, `${from(name)} V${bottomY} H${LANE.turnX(i)} V${y} H${endX}`)
  return { net: n, y }
})
// A line leaves the side of its decoder that faces its register.
const decLane = (box, y, endX) => `M${endX < box.x ? box.x : box.x + box.w} ${y} H${endX}`
decSrc.forEach((n, j) => wire(n, decLane(DEC_A, LANE.a(j), gateXs(j).a + 3)))
decDst.forEach((n, j) => wire(n, decLane(DEC_B, LANE.b(j), gateXs(j).b + 3)))

// The registers are named A to D, the way an 8-bit machine names them. The
// two operand fields of an instruction are SRC and DST, so the field names
// never collide with a register name.
const REG_NAMES = ['A', 'B', 'C', 'D']
for (let n = 0; n < 4; n++) {
  const px = REGS.x + n * REGS.pitch
  const e = net(`${REG_NAMES[n]} e`)
  const s = net(`${REG_NAMES[n]} s`)
  const reg = register(
    { name: REG_NAMES[n], inputs: busNets, set: s, enable: e, bus },
    { x: px, y: REGS.y, role: 'gp' })
  tap.top(reg.shape.cx - TAP_W / 2, REGS.y)

  const g = gateXs(n)
  const rows = [
    { x: g.a, lane: regLanes[0], dec: decSrc[n], decY: LANE.a(n), out: net(`${REG_NAMES[n]} e src`), end: true },
    { x: g.b, lane: regLanes[1], dec: decDst[n], decY: LANE.b(n), out: net(`${REG_NAMES[n]} e dst`), end: true },
    { x: g.s, lane: regLanes[2], dec: decDst[n], decY: LANE.b(n), out: s, end: false },
  ]
  for (const row of rows) {
    circuit.add(new Gate('and', [row.lane.net, row.dec], row.out))
    const pins = gate('and', row.x, REGS.gateY, 'u', row.out)
    wire(row.lane.net, `M${pins.ins[0][0]} ${row.lane.y} V${pins.ins[0][1]}`)
    wire(row.dec, `M${pins.ins[1][0]} ${row.decY} V${pins.ins[1][1]}`)
    if (n > 0) dot(row.lane.net, pins.ins[0][0], row.lane.y)
    if (!row.end) dot(row.dec, pins.ins[1][0], row.decY)
  }
  circuit.add(new Gate('or', [rows[0].out, rows[1].out], e))
  const or = gate('or', g.or, REGS.orY, 'u', e)
  const outY = REGS.gateY - GATE_W
  wire(rows[0].out, `M${g.a} ${outY} V158 H${or.ins[0][0]} V${or.ins[0][1]}`)
  wire(rows[1].out, `M${g.b} ${outY} V158 H${or.ins[1][0]} V${or.ins[1][1]}`)
  const bottom = REGS.y + REG_H
  control(e, `M${or.out[0]} ${or.out[1]} V${bottom}`)
  control(s, `M${g.s} ${outY} V${bottom}`)
  label(or.out[0] + 3, bottom + 11, 'e', 'es')
  label(g.s + 3, bottom + 11, 's', 'es')
}

// The IR wires themselves, from the register up to their highest branch.
// Every branch below the top gets a dot.
irOut.forEach((n, i) => {
  const jog = i < 4 ? '' : `V${irJogY(i)} H${irCol(i)}`
  wire(n, `M${irX(i)} ${IR.y} ${jog} V${irTop[i]}`)
})
for (const [i, y] of irTaps) if (y > irTop[i]) dot(irOut[i], irCol(i), y)

// ---------------------------------------------------------------------------
// 5. Memory: MAR, two 4x16 decoders and 256 cells
//
// The high half of MAR picks the row. The low half picks the column. So an
// address reads like text: left to right, then top to bottom.
// ---------------------------------------------------------------------------

const MEM = { x: 312, y: 1070, cellW: 92, cellH: 17, headY: 1048, headH: 20, rowX: 280, rowW: 30 }
MEM.right = MEM.x + 16 * MEM.cellW
MEM.bottom = MEM.y + 16 * MEM.cellH
module(20, 1042, 1862, MEM.bottom - 1042 + 8, 'ram', '')

const marOut = circuit.word('mar')
const MAR = { x: 30, y: 1074 }
const mar = register(
  { name: 'MAR', inputs: busNets, set: net('MAR s'), outs: marOut },

// ---------------------------------------------------------------------------
// 6. The x266 assembler
//
// x266 is x366 assembly for this machine. Every mnemonic is one x366 mnemonic
// that one SDS-1 instruction performs, so the source reads like the x366 the
// course teaches later and the bytes run on the hardware below.
//
// This mirrors X266Assembler.java, Instruction.java and Instructions.java, so
// a program assembles to the same bytes in either tool. It adds line numbers
// to the errors, which a browser can afford and a compiler cannot.
//
// Assembly runs in three phases, and the order is why an assembler reads its
// source twice:
//   1. address    every instruction gets its address, by adding up the sizes
//                 ahead of it
//   2. labels     every label records the address it sits on
//   3. encode     every instruction builds its bytes, which is the first point
//                 at which a label can be read
// ---------------------------------------------------------------------------

const REGISTERS = { A: 0, B: 1, C: 2, D: 3 }

// The four-bit opcodes of the machine, as the control unit decodes them.
const OP = {
  LD: 0b0000, ST: 0b0001, DATA: 0b0010,
  JMP: 0b0100, JCAEZ: 0b0101, IO: 0b0111,
  ADD: 0b1000, SHR: 0b1001, SHL: 0b1010, NOT: 0b1011,
  AND: 0b1100, OR: 0b1101, XOR: 0b1110, CMP: 0b1111,
}

// Two operands, and the ALU writes into the second field, so the operands swap.
const ALU_TWO = ['ADD', 'AND', 'OR', 'XOR']
// One operand, which is both inputs of the ALU.
const ALU_ONE = ['NOT', 'SHL', 'SHR']
// The four low bits of JCAEZ select the flags, in the order carry, a larger,
// equal, zero.
const JUMPS = { JE: 0b0010, JEQ: 0b0010, JG: 0b0100, JGE: 0b0110 }

const MEMORY_SIZE = 256

// An x366 instruction with no single SDS-1 instruction behind it. Naming them
// gives a better error than "no instruction".
const NOT_IN_X266 = {
  SUB: 'the machine has no subtractor',
  INC: 'the machine has no increment. Add a register that holds 1',
  DEC: 'the machine has no decrement',
  LEA: 'the machine has no address arithmetic',
  JNE: 'the machine can jump on equal, larger, or both',
  JL: 'the machine can jump on equal, larger, or both',
  JLE: 'the machine can jump on equal, larger, or both',
  JZ: 'the machine can jump on equal, larger, or both',
  JC: 'the machine can jump on equal, larger, or both',
  LOOP: 'the machine has no loop instruction. Compare and jump',
  CLF: 'x266 clears no flags. A conditional jump follows its CMP directly',
}

class AsmError extends Error {
  constructor(line, message) {
    super(line ? `line ${line.number}: ${message}` : message)
  }
}

// --- reading the text ------------------------------------------------------

/** Removes a comment and the surrounding space. */
function stripComment(text) {
  const comment = text.indexOf(';')
  return (comment >= 0 ? text.slice(0, comment) : text).trim()
}

/**
 * Splits a line into the mnemonic and its operands. Commas are optional, as
 * x366 allows, and a bracket holds its contents together.
 */
function splitParts(text) {
  const parts = []
  let current = ''
  let inBrackets = false
  for (const ch of text) {
    if (ch === '[') inBrackets = true
    if (ch === ']') inBrackets = false
    if ((ch === ',' || /\s/.test(ch)) && !inBrackets) {
      if (current) parts.push(current)
      current = ''
    } else {
      current += ch
    }
  }
  if (current) parts.push(current)
  if (parts.length) parts[0] = parts[0].toUpperCase()
  return parts
}

function parse(source) {
  const items = []
  source.split('\n').forEach((raw, i) => {
    const line = { number: i + 1, text: raw.trim() }
    let text = stripComment(raw)

    let label = null
    const colon = text.indexOf(':')
    if (colon >= 0) {
      label = text.slice(0, colon).trim().toUpperCase()
      text = text.slice(colon + 1).trim()
      if (!/^[A-Z_]\w*$/.test(label)) throw new AsmError(line, `"${label}" is not a label name`)
    }

    const parts = splitParts(text)
    if (label === null && parts.length === 0) return
    items.push({ line, label, parts, mnemonic: parts[0] ?? '' })
  })
  return items
}

// --- reading one operand ---------------------------------------------------

function reg(item, name) {
  const code = REGISTERS[(name ?? '').trim().toUpperCase()]
  if (code === undefined) {
    throw new AsmError(item.line, `"${name}" is not a register. The machine has A, B, C and D`)
  }
  return code
}

/** The register inside a bracket operand, which holds the address. */
function bracketRegister(item, operand) {
  const inner = operand.slice(1, -1).trim()
  if (inner.includes('+') || inner.includes('-')) {
    throw new AsmError(item.line,
      `${operand} is not in x266. The machine addresses memory through a register only`)
  }
  if (!(inner.toUpperCase() in REGISTERS)) {
    throw new AsmError(item.line,
      `${operand} is not in x266. The machine has no absolute address. Load it into a register first`)
  }
  return reg(item, inner)
}

/** A number, or a label the program has resolved. */
function value(item, text, labels) {
  text = (text ?? '').trim()
  if (!text) throw new AsmError(item.line, `${item.mnemonic} needs an operand`)

  const radix = { '0x': 16, '0X': 16, '0b': 2, '0B': 2 }[text.slice(0, 2)]
  const digits = radix ? text.slice(2) : text
  const valid = radix === 16 ? /^[0-9a-fA-F]+$/ : radix === 2 ? /^[01]+$/ : /^\d+$/
  if (valid.test(digits)) return parseInt(digits, radix ?? 10) & 0xff

  const address = labels.get(text.toUpperCase())
  if (address === undefined) throw new AsmError(item.line, `there is no label named "${text}"`)
  return address
}

// --- the three phases ------------------------------------------------------

/** Phase one: how many bytes one line occupies. */
function sizeOf(item) {
  const op = item.mnemonic
  const arg = i => item.parts[i] ?? ''
  if (!op) return 0                                   // a label on its own line
  if (op === 'DB') return item.parts.length - 1
  if (op === 'HLT' || op === 'HALT') return 2         // a jump to its own address
  if (op === 'JMP' || op in JUMPS) return 2
  // MOV carries a second byte only when its source is an immediate.
  if (op === 'MOV') {
    const src = arg(2)
    return !src.startsWith('[') && !(src.toUpperCase() in REGISTERS) ? 2 : 1
  }
  return 1
}

/** Builds the bytes of the three MOV forms: an immediate, a load and a store. */
function encodeMove(item, labels) {
  const dst = item.parts[1] ?? ''
  const src = item.parts[2] ?? ''
  const dstMemory = dst.startsWith('[')
  const srcMemory = src.startsWith('[')

  if (dstMemory && srcMemory) {
    throw new AsmError(item.line, `memory to memory is not in x266: MOV ${dst}, ${src}`)
  }
  if (srcMemory) {                                    // MOV A, [B]
    return [(OP.LD << 4) | (bracketRegister(item, src) << 2) | reg(item, dst)]
  }
  if (dstMemory) {                                    // MOV [B], A
    return [(OP.ST << 4) | (bracketRegister(item, dst) << 2) | reg(item, src)]
  }
  if (src.toUpperCase() in REGISTERS) {
    throw new AsmError(item.line,
      `MOV ${dst}, ${src} is not in x266. The machine has no register to register move`)
  }
  return [(OP.DATA << 4) | reg(item, dst), value(item, src, labels)]   // MOV A, 10
}

/** Phase three: the bytes of one line. */
function encode(item, labels) {
  const op = item.mnemonic
  const a1 = item.parts[1] ?? ''
  const a2 = item.parts[2] ?? ''

  if (!op) return []
  if (op === 'DB') return item.parts.slice(1).map(part => value(item, part, labels) & 0xff)

  // The machine has no halt, so it stops by jumping to itself.
  if (op === 'HLT' || op === 'HALT') return [OP.JMP << 4, item.address]
  if (op === 'JMP') return [OP.JMP << 4, value(item, a1, labels)]
  if (op in JUMPS) return [(OP.JCAEZ << 4) | JUMPS[op], value(item, a1, labels)]

  if (op === 'MOV') return encodeMove(item, labels)

  // The machine has a device in the instruction set, but this emulator draws
  // no device to attach to it.
  if (op === 'SYSCALL') {
    throw new AsmError(item.line,
      `SYSCALL is not in this emulator. The drawing has no input or output device, `
      + `so PRINT and READ have nothing to reach. Use the register and memory panels instead`)
  }

  // Two operands, so the x366 destination goes in the second field.
  if (ALU_TWO.includes(op)) return [(OP[op] << 4) | (reg(item, a2) << 2) | reg(item, a1)]
  // CMP writes no register, so its operands keep the x366 order.
  if (op === 'CMP') return [(OP.CMP << 4) | (reg(item, a1) << 2) | reg(item, a2)]
  // One operand, so the register is both inputs of the ALU.
  if (ALU_ONE.includes(op)) return [(OP[op] << 4) | (reg(item, a1) << 2) | reg(item, a1)]

  if (op in NOT_IN_X266) throw new AsmError(item.line, `${op} is not in x266: ${NOT_IN_X266[op]}`)
  throw new AsmError(item.line, `there is no instruction named ${op}. Open help for the list`)
}

/** Assembles the source and returns one entry per line, with its bytes. */
function assemble(source) {
  const items = parse(source)

  // Phase one: addresses.
  let address = 0
  for (const item of items) {
    item.address = address
    item.size = sizeOf(item)
    address += item.size
  }
  if (address > MEMORY_SIZE) {
    throw new AsmError(null, `the program is ${address} bytes, and the machine holds ${MEMORY_SIZE}`)
  }

  // Phase two: labels.
  const labels = new Map()
  for (const item of items) {
    if (item.label === null) continue
    if (labels.has(item.label)) throw new AsmError(item.line, `the label ${item.label} is defined twice`)
    labels.set(item.label, item.address)
  }

  // Phase three: bytes.
  for (const item of items) {
    item.bytes = encode(item, labels)
  }
  return items.filter(item => item.bytes.length > 0)
}

const SAMPLE = `; 5 x 5 by repeated addition. The product lands in A.
        MOV A, 0        ; the product
        MOV B, 5        ; the multiplicand
        MOV C, 0        ; how many times it has been added
        MOV D, 1        ; the step
loop:   ADD A, B        ; A = A + B
        ADD C, D        ; C = C + 1
        CMP C, B        ; five times yet?
        JE  done
        JMP loop
done:   HLT`

const PROGRAMS = {
  and: `; AND keeps only the bits that are on in both registers.
        MOV A, 0b11001010
        MOV B, 0b01101100
        AND A, B
        HLT`,
  sample: SAMPLE,
}

const HELP = `x266 is x366 assembly for the SDS-1. Every instruction here is one
x366 mnemonic that one machine instruction performs.

The registers are A, B, C and D. Each one holds a byte.
A number is decimal, 0x hex or 0b binary. "name:" marks a label.
A comment starts with ";". Commas are optional.

  MOV A, 10       load a number into a register
  MOV A, [B]      read the memory that B points at
  MOV [B], A      write A into the memory that B points at
  ADD A, B        A = A + B, and the same for AND, OR, XOR
  NOT A           A = NOT A, and the same for SHL and SHR, one place
  CMP A, B        set the flags only
  JMP label       jump
  JE label        jump when the last CMP was equal
  JG label        jump when the first operand was larger, unsigned
  JGE label       either of the two above
  HLT             stop, by jumping to its own address
  DB 1, 2, 3      data bytes

CMP sets the flags and a jump reads them, so a conditional jump must follow
its CMP directly.

These are not in x266, because no single machine instruction performs them:
SUB, INC, DEC, LEA, JNE, JL, JLE, LOOP, MOV A, B and MOV A, [0x20].
SYSCALL is not here either, because this drawing has no device attached.

With the clock stopped:
  click a register bit or a memory bit to flip it

  click the clock for its next phase, and the stepper for its next step`

// 7. The console: the keys, the run loop and the assembler panel
// ---------------------------------------------------------------------------

const $ = id => document.getElementById(id)
let timer = null

function showStatus(text) {
  const phase = ['idle', 'enable', 'enable + set', 'enable'][sequencer.phase]
  $('status').textContent = `${text} | step ${sequencer.step + 1} | ${phase}`
}

// Every tick saves the machine first, so "back tick" can restore it. The
// history is bounded; each entry holds a copy of memory.
const history = []
const HISTORY_MAX = 4000

function snapshot() {
  return {
    registers: registers.map(reg => reg.value),
    cells: ram.cells.slice(),
    phase: sequencer.phase,
    step: sequencer.step,
    started: sequencer.started,
  }
}

function restore(state) {
  registers.forEach((reg, i) => { reg.value = state.registers[i] })
  ram.cells.set(state.cells)
  sequencer.phase = state.phase
  sequencer.step = state.step
  sequencer.started = state.started
  for (let address = 0; address < 256; address++) showCell(address)
}

function remember() {
  history.push(snapshot())
  if (history.length > HISTORY_MAX) history.shift()
}

function tick() {
  remember()
  sequencer.tick()
  refresh()
}

function backTick() {
  stop()
  const state = history.pop()
  if (!state) return
  restore(state)
  refresh()
  showStatus('stopped')
}

const atStepStart = () => sequencer.phase === 0
// An instruction is over when step 6 has gone idle.
const atInstructionStart = () => sequencer.phase === 0 && (sequencer.step === 5 || !sequencer.started)

function advance(until) {
  stop()
  do tick(); while (!until())
  showStatus('stopped')
}

// A jump to its own address is how a program for this machine halts, which is
// what HLT assembles to.
let lastIar = -1
function halted() {
  if (!atInstructionStart()) return false
  const same = iar.value === lastIar
  lastIar = iar.value
  return same
}

function run() {
  stop()
  lastIar = -1
  const loop = () => {
    const perSecond = Math.max(1, Number($('speed').value) || 1) * 4
    // A browser timer is not faster than about 250 Hz, so batch the ticks.
    const batch = Math.ceil(perSecond / 120)
    for (let i = 0; i < batch; i++) {
      tick()
      if (halted()) {
        stop()
        showStatus('halted')
        return
      }
    }
    showStatus('running')
    timer = setTimeout(loop, (1000 * batch) / perSecond)
  }
  loop()
}

function stop() {
  clearTimeout(timer)
  timer = null
  showStatus('stopped')
}

function reset() {
  stop()
  history.length = 0
  for (const reg of registers) reg.reset()
  sequencer.reset()
  for (const held of holds.keys()) held.held = false
  refresh()
  showStatus('stopped')
}

function showEditorState() {
  const dirty = source.get().trim() !== (loadedSource ?? '').trim()

        // The completion list needs its own colours. Without them it inherits
        // a dark default and paints as one solid bar with no readable text.
        'editorWidget.background': '#e9e4d4',
        'editorWidget.border': '#8c8676',
        'editorWidget.foreground': '#2b2620',
        'editorSuggestWidget.background': '#e9e4d4',
        'editorSuggestWidget.border': '#8c8676',
        'editorSuggestWidget.foreground': '#2b2620',
        'editorSuggestWidget.selectedBackground': '#bfb7a0',
        'editorSuggestWidget.selectedForeground': '#2b2620',
        'editorSuggestWidget.highlightForeground': '#8a4b1e',
        'editorSuggestWidget.focusHighlightForeground': '#8a4b1e',
        'list.hoverBackground': '#ded8c6',
      },
    })

    monacoEditor = monaco.editor.create($('editor'), {
      value: $('source').value,
      language: 'x266',
      theme: 'sds1',
      fontFamily: "'Cascadia Mono', Menlo, 'Courier New', monospace",
      fontSize: 12,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: true,
      renderLineHighlight: 'line',
      tabSize: 8,
      // The editor pane clips its overflow, so the completion list has to be
      // rendered outside it or it is cut off at the pane edge.
      fixedOverflowWidgets: true,
    })
    monacoEditor.addCommand(monaco.KeyCode.F2, assembleAndLoad)
    monacoEditor.onDidChangeModelContent(showEditorState)
    showEditorState()
  }, () => {
    arrived = true
    clearTimeout(giveUp)
    usePlainEditor('offline')
  })
}

/* --- assembling ----------------------------------------------------------- */

function assembleAndLoad() {
  const listing = $('listing')
  try {
    const text = source.get()
    const items = assemble(text)
    const origin = Number($('origin').value) || 0
    reset()
    loadMemory(items.flatMap(item => item.bytes), origin)
    loadedSource = text
    showEditorState()
    refresh()
    listing.textContent = items.map(item => {
      const at = String(origin + item.address).padStart(3)
      const bits = item.bytes.map(b => b.toString(2).padStart(8, '0')).join(' ')
      return `${at}  ${bits.padEnd(17)}  ${item.line.text}`
    }).join('\n')
  } catch (error) {
    listing.innerHTML = ''
    const message = document.createElement('span')
    message.className = 'error'
    message.textContent = error.message
    listing.append(message)
    // Nothing reached memory, so the editor still does not match it.
    showEditorState()
  }
}

$('back').onclick = backTick
$('tick').onclick = () => advance(() => true)
$('step').onclick = () => advance(atStepStart)
$('instruction').onclick = () => advance(atInstructionStart)
$('run').onclick = run
$('stop').onclick = stop
$('reset').onclick = reset
$('assemble').onclick = assembleAndLoad
$('sample').onclick = () => {
  source.set(SAMPLE)
  assembleAndLoad()
}
$('clear-ram').onclick = () => {
  reset()
  ram.cells.fill(0)
  loadMemory([])
  loadedSource = null
  showEditorState()
  refresh()
}
$('wire-color').oninput = event => document.documentElement.style.setProperty('--on', event.target.value)
$('toggle-program').onclick = () => document.querySelector('main').classList.toggle('no-program')
$('help-text').textContent = HELP
$('help').onclick = () => $('help-dialog').showModal()
$('source').addEventListener('keydown', event => {
  if (event.key === 'F2') assembleAndLoad()
})
$('source').addEventListener('input', showEditorState)

const params = new URLSearchParams(location.search)
if (params.has('speed')) $('speed').value = params.get('speed')
const preset = PROGRAMS[params.get('prog')?.toLowerCase()]
if (preset) {
  $('source').value = preset
  assembleAndLoad()
}
startEditor()
showEditorState()
refresh()
showStatus('stopped')
</script>
